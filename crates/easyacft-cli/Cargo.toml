[package]
name = "easyacft-cli"
description = "The easyacft command: check, sim, explain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "easyacft"
path = "src/main.rs"

[dependencies]
easyacft-core = { path = "../easyacft-core" }
easyacft-lang = { path = "../easyacft-lang" }
easyacft-parts = { path = "../easyacft-parts" }
easyacft-import = { path = "../easyacft-import" }
easyacft-export = { path = "../easyacft-export" }
toml_edit = { version = "=0.22.23", default-features = false, features = ["parse"] }
