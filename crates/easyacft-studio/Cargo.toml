[package]
name = "easyacft-studio"
description = "EasyAcft Studio: view and edit an aircraft's systems"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "easyacft-studio"
path = "src/main.rs"

[dependencies]
easyacft-core = { path = "../easyacft-core" }
easyacft-lang = { path = "../easyacft-lang" }
easyacft-parts = { path = "../easyacft-parts" }
easyacft-export = { path = "../easyacft-export" }
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "=0.29.0"
toml_edit = { version = "=0.22.23", default-features = false, features = ["parse", "display"] }
