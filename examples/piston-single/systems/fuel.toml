[[fuel.tank]]
id = "left"
capacity = "75 kg"
quantity = "60 kg"
arm = "1.2 m"

[[fuel.tank]]
id = "right"
capacity = "75 kg"
quantity = "60 kg"
arm = "1.2 m"

[[fuel.line]]
id = "manifold"

# Gravity feed through the selector
[[fuel.valve]]
id = "sel_left"
between = ["left", "manifold"]
open_when = "fuel_selector.position == 1 || fuel_selector.position == 3"
flow = "0.2 kg/s"

[[fuel.valve]]
id = "sel_right"
between = ["right", "manifold"]
open_when = "fuel_selector.position == 2 || fuel_selector.position == 3"
flow = "0.2 kg/s"

[[fuel.tank]]
id = "sump"
capacity = "1 kg"
quantity = "1 kg"

[[fuel.pump]]
id = "aux_boost"
tank = "sump"
outlet = "manifold"
pressure = "6 psi"
flow = "0.05 kg/s"
running_when = "aux_pump.powered"

[[fuel.feed]]
id = "eng_feed"
line = "manifold"
demand = "eng.fuel_flow"
minimum = "0.1 psi"
