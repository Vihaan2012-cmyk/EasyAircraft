# Batteries, APU, ADIRS, then the four engines, then generators on line and the APU shut down.
[[step]]
at = "0 s"
set = { "bat1_pb.pressed" = 1, "bat2_pb.pressed" = 1, "ess_bat_pb.pressed" = 1, "apu_bat_pb.pressed" = 1 }

[[expect]]
at = "2 s"
that = "dc_ess.powered && dc_apu.powered && dc1.powered && !ac1.powered && fws_up.on == false"

[[step]]
at = "3 s"
set = { "apu_master_pb.pressed" = 1 }

[[step]]
at = "6 s"
set = { "apu_start_pb.pressed" = 1 }

[[expect]]
at = "100 s"
that = "apu.available && ac1.powered && ac2.powered && ac3.powered && ac4.powered && ac_ess.powered && centre_l.pressure > 20 psi && fws_up.on && prim_1.running && cds_du_1_unit.running"

[[step]]
at = "100 s"
set = { "adirs1_mode.position" = 1, "adirs2_mode.position" = 1, "adirs3_mode.position" = 1 }

[[step]]
at = "105 s"
set = { "eng_mode.position" = 2, "eng4_master.on" = 1 }

[[expect]]
at = "200 s"
that = "eng4.running && glc4.closed && yellow.available"

[[step]]
at = "205 s"
set = { "eng3_master.on" = 1 }

[[step]]
at = "305 s"
set = { "eng2_master.on" = 1 }

[[step]]
at = "405 s"
set = { "eng1_master.on" = 1 }

[[expect]]
at = "520 s"
that = "eng1.running && eng2.running && eng3.running && glc1.closed && glc2.closed && glc3.closed && green.available && !agc_a.closed && !agc_b.closed"

[[step]]
at = "525 s"
set = { "eng_mode.position" = 1, "apu_master_pb.pressed" = 0 }

[[expect]]
at = "660 s"
that = "ir1.aligned && ir2.aligned && ir3.aligned && fctl_law.value == 0 && !master_caution.lit && !master_warning.lit"

[[step]]
at = "661 s"
set = { "parking_brake.on" = 0, "tla1.value" = 0.9, "tla2.value" = 0.9, "tla3.value" = 0.9, "tla4.value" = 0.9 }

[[expect]]
at = "720 s"
that = "eng1.n1 > 80 && eng4.thrust > 200 kN"
