# Engines running on the ground, then the green engine pumps fail: green drops, the backups take over.
[[step]]
at = "0 s"
set = { "bat1_pb.pressed" = 1, "bat2_pb.pressed" = 1, "ess_bat_pb.pressed" = 1, "apu_bat_pb.pressed" = 1, "apu_master_pb.pressed" = 1 }

[[step]]
at = "3 s"
set = { "apu_start_pb.pressed" = 1 }

[[step]]
at = "80 s"
set = { "eng_mode.position" = 2, "eng1_master.on" = 1 }

[[step]]
at = "180 s"
set = { "eng4_master.on" = 1 }

[[expect]]
at = "280 s"
that = "green.available && yellow.available && eng1.running && eng4.running"

[[step]]
at = "281 s"
set = { "eng_mode.position" = 1, "edp1a.failed" = 1, "edp1b.failed" = 1 }

[[expect]]
at = "300 s"
that = "green.low && yellow.available && alert_green_lo_pr.on && master_caution.lit && eha_flight_controls.power > 5 kW"

[[step]]
at = "301 s"
set = { "green_elec_pb.pressed" = 1, "parking_brake.on" = 0, "brake_l.value" = 1 }

[[expect]]
at = "330 s"
that = "green_elec_a.running && green_elec_b.running && hyd_epump_ga.powered"
