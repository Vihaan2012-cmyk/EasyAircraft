# A 310 kN class three-spool turbofan: ICAO emissions databank class figures,
# overall pressure ratio about 39, bypass ratio about 8.5.
[[engine.gas_turbine]]
id = "eng{n}"
count = 4
air = "air"
fuel_flow = "eng{n}_feed.flow"
design_thrust = "310 kN"
airflow = "1200 kg/s"
bypass_ratio = 8.5
spools = 3
fan_pr = 1.5
ipc_pr = 5.4
hpc_pr = 4.8
fan_efficiency = 0.92
ipc_efficiency = 0.89
hpc_efficiency = 0.87
hpt_efficiency = 0.90
ipt_efficiency = 0.91
lpt_efficiency = 0.92
cooling = 0.15
lp_rpm = "2900 rpm"
ip_rpm = "8300 rpm"
hp_rpm = "12200 rpm"
lp_inertia = 900
ip_inertia = 40
hp_inertia = 20
starter_torque = "if(fadec{n}.starter && start_valve{n}.supplied, 1800 N*m, 0 N*m)"
offtake = "gen{n}.load / 0.9"
bleed = "bleed{n}_port.flow"
reverser = "fadec{n}.reverser"

[[fadec.controller]]
id = "fadec{n}"
count = 4
engine = "eng{n}"
lever = "tla{n}.value"
master = "eng{n}_master.on && dc_ess.powered && !fire{n}_handle.on"
start = "eng_mode.position == 2"
idle = "20"
max = "100"
fuel_on_at = 10
starter_cutout = 40

[[apu.unit]]
id = "apu"
master = "apu_master.on && dc_apu.voltage > 18 V && !apu_fire_handle.on"
start = "apu_start.on"
start_time = "60 s"
bleed_load = "apu_bleed.flow"
bleed_rating = "2.4 kg/s"
generator_load = "apu_gen_a.load + apu_gen_b.load"
generator_rating = "240 kW"
fuel_flow = "0.07 kg/s"

[[output.force]]
id = "eng1_force"
force = "eng1.thrust"
x = "-25.7 m"
y = "-2.5 m"
z = "-3 m"

[[output.force]]
id = "eng2_force"
force = "eng2.thrust"
x = "-15.6 m"
y = "-3.5 m"
z = "-7 m"

[[output.force]]
id = "eng3_force"
force = "eng3.thrust"
x = "15.6 m"
y = "-3.5 m"
z = "-7 m"

[[output.force]]
id = "eng4_force"
force = "eng4.thrust"
x = "25.7 m"
y = "-2.5 m"
z = "-3 m"
