# Two 5000 psi systems, green from engines 1 and 2, yellow from engines 3 and 4,
# two engine-driven pumps per engine and electric pumps for ground use.
[[hydraulic.circuit]]
id = "green"
nominal = "5000 psi"
fluid = "60 L"
low_pressure = "2500 psi"

[[hydraulic.circuit]]
id = "yellow"
nominal = "5000 psi"
fluid = "60 L"
low_pressure = "2500 psi"

[[hydraulic.pump]]
id = "edp{n}a"
count = 2
circuit = "green"
pressure = "5000 psi"
flow = "150 L/min"
running_when = "edp{n}_sw.on && eng{n}.n3 > 30"

[[hydraulic.pump]]
id = "edp{n}b"
count = 2
circuit = "green"
pressure = "5000 psi"
flow = "150 L/min"
running_when = "edp{n}_sw.on && eng{n}.n3 > 30"

[[hydraulic.pump]]
id = "edp3a"
circuit = "yellow"
pressure = "5000 psi"
flow = "150 L/min"
running_when = "edp3_sw.on && eng3.n3 > 30"

[[hydraulic.pump]]
id = "edp3b"
circuit = "yellow"
pressure = "5000 psi"
flow = "150 L/min"
running_when = "edp3_sw.on && eng3.n3 > 30"

[[hydraulic.pump]]
id = "edp4a"
circuit = "yellow"
pressure = "5000 psi"
flow = "150 L/min"
running_when = "edp4_sw.on && eng4.n3 > 30"

[[hydraulic.pump]]
id = "edp4b"
circuit = "yellow"
pressure = "5000 psi"
flow = "150 L/min"
running_when = "edp4_sw.on && eng4.n3 > 30"

[[hydraulic.pump]]
id = "green_elec"
circuit = "green"
pressure = "5000 psi"
flow = "30 L/min"
running_when = "green_elec_motor.powered"

[[hydraulic.pump]]
id = "yellow_elec"
circuit = "yellow"
pressure = "5000 psi"
flow = "30 L/min"
running_when = "yellow_elec_motor.powered"

[[hydraulic.accumulator]]
id = "brake_acc"
circuit = "yellow"
volume = "10 L"
precharge = "1500 psi"

[[hydraulic.consumer]]
id = "flight_controls_g"
circuit = "green"
flow = "60 L/min"
moving_when = "!air.on_ground"

[[hydraulic.consumer]]
id = "flight_controls_y"
circuit = "yellow"
flow = "60 L/min"
moving_when = "!air.on_ground"
